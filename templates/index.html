<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显著目标检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            overflow-x: hidden;
            color: #e0e6f0;
        }

        /* ---- 动态粒子画布 ---- */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ---- 背景光晕 ---- */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12), transparent);
            top: -200px;
            left: -100px;
        }
        .bg-glow-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(120, 60, 255, 0.10), transparent);
            bottom: -150px;
            right: -100px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ---- 顶栏 ---- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            margin-bottom: 36px;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-brand .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .topbar-brand h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #e0e6f0, #8ab4f8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-badge {
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.25);
            color: #00d4ff;
            letter-spacing: 0.5px;
        }

        /* ---- 主卡 ---- */
        .main-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            padding: 36px 32px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s;
        }
        .main-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ---- 上传区 ---- */
        .upload-area {
            border: 2px dashed rgba(0, 212, 255, 0.25);
            border-radius: 14px;
            padding: 48px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s ease;
            background: rgba(0, 212, 255, 0.03);
            position: relative;
        }
        .upload-area:hover {
            border-color: rgba(0, 212, 255, 0.55);
            background: rgba(0, 212, 255, 0.06);
        }
        .upload-area.dragover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.10);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
        }
        .upload-area .upload-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(123, 47, 247, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-area .upload-icon-wrap svg {
            width: 32px;
            height: 32px;
            stroke: #00d4ff;
            fill: none;
            stroke-width: 1.8;
        }
        .upload-area .upload-title {
            font-size: 16px;
            font-weight: 500;
            color: #c8d0dc;
        }
        .upload-area .upload-title span {
            color: #00d4ff;
            font-weight: 600;
        }
        .upload-area .upload-hint {
            margin-top: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }
        #fileInput {
            display: none;
        }

        /* ---- 预览 ---- */
        .preview-section {
            display: none;
            margin-top: 24px;
        }
        .preview-section .preview-img-wrap {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .preview-section .preview-img-wrap img {
            display: block;
            max-width: 100%;
            max-height: 320px;
            border-radius: 12px;
        }
        .preview-section .preview-label {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            color: #fff;
            letter-spacing: 0.3px;
        }

        /* ---- 按钮 ---- */
        .btn-row {
            margin-top: 24px;
            text-align: center;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 40px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #0077ff, #7b2ff7);
            box-shadow: 0 4px 20px rgba(0, 119, 255, 0.30);
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 119, 255, 0.45);
        }
        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---- 加载 ---- */
        .loading-section {
            display: none;
            text-align: center;
            padding: 40px 0;
        }
        .loader-ring {
            display: inline-block;
            position: relative;
            width: 56px;
            height: 56px;
        }
        .loader-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 44px;
            height: 44px;
            margin: 6px;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #00d4ff transparent transparent transparent;
        }
        .loader-ring div:nth-child(1) { animation-delay: -0.45s; }
        .loader-ring div:nth-child(2) { animation-delay: -0.3s; }
        .loader-ring div:nth-child(3) { animation-delay: -0.15s; }
        @keyframes lds-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-section .load-text {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(255,255,255,0.50);
            letter-spacing: 1px;
        }
        .loading-section .load-progress-bar {
            width: 200px;
            height: 3px;
            margin: 12px auto 0;
            border-radius: 4px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
        }
        .loading-section .load-progress-bar .bar-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            border-radius: 4px;
            animation: progressAnim 2.5s ease-in-out infinite;
        }
        @keyframes progressAnim {
            0%   { width: 0%; }
            50%  { width: 65%; }
            100% { width: 100%; }
        }

        /* ---- 结果 ---- */
        .results-section {
            display: none;
        }
        .results-section .results-title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #c8d0dc;
            letter-spacing: 0.5px;
        }
        .results-section .results-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00d4ff;
            margin-right: 10px;
            vertical-align: middle;
            box-shadow: 0 0 12px #00d4ff;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.25s, transform 0.2s;
        }
        .result-card:hover {
            border-color: rgba(0, 212, 255, 0.25);
            transform: translateY(-2px);
        }
        .result-card .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            font-weight: 500;
            color: #a0aab8;
        }
        .result-card .card-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .result-card .card-body {
            padding: 12px;
        }
        .result-card .card-body img {
            display: block;
            width: 100%;
            border-radius: 8px;
            background: #111622;
        }

        /* ---- 特性栏 ---- */
        .features-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .feature-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: #8892a0;
            transition: border-color 0.2s, background 0.2s;
        }
        .feature-chip:hover {
            border-color: rgba(0, 212, 255, 0.2);
            background: rgba(0, 212, 255, 0.05);
        }
        .feature-chip .chip-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .chip-cnn    { background: rgba(0, 212, 255, 0.12); }
        .chip-fusion { background: rgba(123, 47, 247, 0.12); }
        .chip-fpn    { background: rgba(0, 200, 150, 0.12); }
        .chip-edge   { background: rgba(255, 180, 0, 0.12); }

        /* ---- footer ---- */
        .footer {
            text-align: center;
            padding: 28px 0 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.20);
            letter-spacing: 0.5px;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 820px) {
            .results-grid { grid-template-columns: 1fr 1fr; }
            .features-row { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 540px) {
            .results-grid { grid-template-columns: 1fr; }
            .features-row { grid-template-columns: 1fr; }
            .topbar { flex-wrap: wrap; gap: 10px; }
            .main-card { padding: 24px 16px; }
        }

        /* ---- fade-in ---- */
        .fade-in {
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .fade-in:nth-child(1) { animation-delay: 0.05s; }
        .fade-in:nth-child(2) { animation-delay: 0.10s; }
        .fade-in:nth-child(3) { animation-delay: 0.15s; }
        .fade-in:nth-child(4) { animation-delay: 0.20s; }
    </style>
</head>
<body>

    <!-- 粒子背景 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 光晕 -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">

        <!-- 顶栏 -->
        <div class="topbar fade-in">
            <div class="topbar-brand">
                <div class="logo-icon">S</div>
                <h1>显著目标检测</h1>
            </div>
            <span class="topbar-badge">SOD · CNN + Transformer</span>
        </div>

        <!-- 主卡片 -->
        <div class="main-card fade-in">

            <!-- 上传 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon-wrap">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                </div>
                <div class="upload-title">
                    拖拽图片至此处，或 <span>浏览上传</span>
                </div>
                <div class="upload-hint">支持 PNG / JPG / JPEG / BMP / WebP</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <!-- 预览 -->
            <div class="preview-section" id="previewSection">
                <div class="preview-img-wrap">
                    <span class="preview-label">预览</span>
                    <img id="previewImage" src="" alt="预览图">
                </div>
            </div>

            <!-- 按钮 -->
            <div class="btn-row">
                <button class="btn-primary" id="detectBtn" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    开始检测
                </button>
            </div>

            <!-- 特性 -->
            <div class="features-row">
                <div class="feature-chip">
                    <span class="chip-icon chip-cnn">🔄</span>
                    ResNet34 + PVTv2 双流编码
                </div>
                <div class="feature-chip">
                    <span class="chip-icon chip-fusion">🎛️</span>
                    自适应门控融合 SAGF
                </div>
                <div class="feature-chip">
                    <span class="chip-icon chip-fpn">🔺</span>
                    双向特征金字塔 BiFPN
                </div>
                <div class="feature-chip">
                    <span class="chip-icon chip-edge">📐</span>
                    多分辨率边缘监督
                </div>
            </div>
        </div>

        <!-- 加载 -->
        <div class="main-card loading-section" id="loadingSection">
            <div class="loader-ring"><div></div><div></div><div></div><div></div></div>
            <div class="load-text">模型推理中，请稍候...</div>
            <div class="load-progress-bar"><div class="bar-inner"></div></div>
        </div>

        <!-- 结果 -->
        <div class="main-card results-section" id="resultsSection">
            <div class="results-title">检测结果</div>
            <div class="results-grid">
                <div class="result-card">
                    <div class="card-header"><span class="dot" style="background:#5b7fbf;"></span>原始图像</div>
                    <div class="card-body"><img id="resultOriginal" src="" alt="原始图像"></div>
                </div>
                <div class="result-card">
                    <div class="card-header"><span class="dot" style="background:#00d4ff;"></span>显著图</div>
                    <div class="card-body"><img id="resultSaliency" src="" alt="显著图"></div>
                </div>
                <div class="result-card">
                    <div class="card-header"><span class="dot" style="background:#f5a623;"></span>边缘图</div>
                    <div class="card-body"><img id="resultEdge" src="" alt="边缘图"></div>
                </div>
                <div class="result-card">
                    <div class="card-header"><span class="dot" style="background:#ff6b6b;"></span>叠加效果</div>
                    <div class="card-body"><img id="resultOverlay" src="" alt="叠加效果"></div>
                </div>
            </div>
        </div>

        <div class="footer">显著目标检测系统 · Deep Learning based SOD</div>
    </div>

    <script>
        /* ---- 粒子动画 ---- */
        (function initParticles() {
            const cvs = document.getElementById('particles-canvas');
            const ctx = cvs.getContext('2d');
            let w, h, particles = [];

            function resize() {
                w = cvs.width = window.innerWidth;
                h = cvs.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const COUNT = 60;
            for (let i = 0; i < COUNT; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 2 + 0.8,
                    a: Math.random() * 0.5 + 0.15,
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 180, 255, ${p.a})`;
                    ctx.fill();
                }
                // 连线
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = dx * dx + dy * dy;
                        if (dist < 140 * 140) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 180, 255, ${0.08 * (1 - dist / (140 * 140))})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        /* ---- 交互逻辑 ---- */
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const detectBtn = document.getElementById('detectBtn');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewSection.style.display = 'block';
                detectBtn.disabled = false;
                resultsSection.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            detectBtn.disabled = true;
            loadingSection.style.display = 'block';
            resultsSection.style.display = 'none';

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('resultOriginal').src = '/static/' + data.original;
                    document.getElementById('resultSaliency').src = '/static/' + data.saliency;
                    document.getElementById('resultEdge').src = '/static/' + data.edge;
                    document.getElementById('resultOverlay').src = '/static/' + data.overlay;
                    resultsSection.style.display = 'block';
                } else {
                    alert('检测失败: ' + data.error);
                }
            } catch (err) {
                alert('请求失败: ' + err.message);
            } finally {
                loadingSection.style.display = 'none';
                detectBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
