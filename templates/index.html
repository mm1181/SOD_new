<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显著目标检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #666;
            font-size: 1.1em;
        }
        
        .upload-text span {
            color: #667eea;
            font-weight: bold;
        }
        
        #fileInput {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-container {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .results {
            display: none;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-item {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .result-item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .result-item img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .feature {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            color: #666;
            font-size: 0.9em;
        }
        
        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 显著目标检测系统</h1>
            <p>基于CNN-Transformer双流网络的深度学习模型</p>
        </header>
        
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text">
                    拖拽图片到此处，或 <span>点击上传</span>
                </div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div class="preview-container" id="previewContainer" style="display: none;">
                <img id="previewImage" src="" alt="预览图">
            </div>
            
            <div style="text-align: center;">
                <button class="btn" id="detectBtn" disabled>🚀 开始检测</button>
            </div>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🔄</div>
                    <div class="feature-text">ResNet34 + PVTv2-B2 双流特征提取</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎛️</div>
                    <div class="feature-text">空间自适应门控融合 (SAGF)</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔺</div>
                    <div class="feature-text">双向特征金字塔 (BiFPN)</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📐</div>
                    <div class="feature-text">多分辨率边缘监督</div>
                </div>
            </div>
        </div>
        
        <div class="card loading" id="loading">
            <div class="spinner"></div>
            <p>正在处理中，请稍候...</p>
        </div>
        
        <div class="card results" id="results">
            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">📊 检测结果</h2>
            <div class="results-grid">
                <div class="result-item">
                    <h3>🖼️ 原始图像</h3>
                    <img id="resultOriginal" src="" alt="原始图像">
                </div>
                <div class="result-item">
                    <h3>🎨 显著图</h3>
                    <img id="resultSaliency" src="" alt="显著图">
                </div>
                <div class="result-item">
                    <h3>📐 边缘图</h3>
                    <img id="resultEdge" src="" alt="边缘图">
                </div>
                <div class="result-item">
                    <h3>🔍 叠加效果</h3>
                    <img id="resultOverlay" src="" alt="叠加效果">
                </div>
            </div>
        </div>
        
        <footer>
            <p>显著目标检测 - 基于深度学习的图像分析系统</p>
        </footer>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const detectBtn = document.getElementById('detectBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        
        let selectedFile = null;
        
        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件！');
                return;
            }
            
            selectedFile = file;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                detectBtn.disabled = false;
                results.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        // 检测按钮
        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            detectBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('resultOriginal').src = '/static/' + data.original;
                    document.getElementById('resultSaliency').src = '/static/' + data.saliency;
                    document.getElementById('resultEdge').src = '/static/' + data.edge;
                    document.getElementById('resultOverlay').src = '/static/' + data.overlay;
                    results.style.display = 'block';
                } else {
                    alert('检测失败: ' + data.error);
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                loading.style.display = 'none';
                detectBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
