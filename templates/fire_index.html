
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防器材检测 - 纯YOLO模式</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .mode-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .upload-area {
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        .upload-area:hover {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.1);
        }
        .upload-area.dragover {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        #fileInput { display: none; }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .results { grid-template-columns: 1fr; }
        }
        .result-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
        }
        .result-card h3 {
            margin-bottom: 15px;
            color: #3498db;
        }
        .result-card img {
            width: 100%;
            border-radius: 8px;
        }
        .alarm-box {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .alarm-box.safe {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
        }
        .alarm-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .detection-list {
            margin-top: 15px;
        }
        .detection-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .detection-item .label {
            color: #2ecc71;
            font-weight: bold;
        }
        .detection-item .fire {
            color: #e74c3c;
        }
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .loading.show { display: block; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 消防器材检测 <span class="mode-badge">纯YOLO模式</span></h1>
        <p class="subtitle">上传动火作业现场图片，检测消防器材配备情况</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <p>点击或拖拽图片到此处上传</p>
            <p style="color: #666; font-size: 0.9em; margin-top: 10px;">支持 PNG, JPG, JPEG, BMP, WEBP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在检测中...</p>
        </div>
        
        <div class="results" id="results" style="display: none;">
            <div class="result-card">
                <h3>📸 原始图片</h3>
                <img id="originalImage" src="" alt="原始图片">
            </div>
            <div class="result-card">
                <h3>🎯 检测结果</h3>
                <img id="resultImage" src="" alt="检测结果">
                <div id="alarmBox" class="alarm-box">
                    <div class="alarm-title" id="alarmTitle">检测结果</div>
                    <div id="alarmMessage"></div>
                </div>
                <div class="detection-list" id="detectionList"></div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        async function handleFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            loading.classList.add('show');
            results.style.display = 'none';
            
            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert('检测失败: ' + data.error);
                    return;
                }
                
                displayResults(data);
                
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                loading.classList.remove('show');
            }
        }
        
        function displayResults(data) {
            results.style.display = 'grid';
            
            document.getElementById('originalImage').src = '/static/' + data.original;
            document.getElementById('resultImage').src = '/static/' + data.result_image;
            
            const alarmBox = document.getElementById('alarmBox');
            const alarmTitle = document.getElementById('alarmTitle');
            const alarmMessage = document.getElementById('alarmMessage');
            
            if (data.is_alarm) {
                alarmBox.classList.remove('safe');
                alarmTitle.textContent = '⚠️ ' + (data.alarm_details?.boxes?.[0]?.type || '检测到违规');
                alarmMessage.textContent = data.alarm_details?.boxes?.[0]?.msg || '请检查消防器材配备情况';
            } else {
                alarmBox.classList.add('safe');
                alarmTitle.textContent = '✅ 检测通过';
                alarmMessage.textContent = '消防器材配备符合要求';
            }
            
            // 显示检测详情
            const detectionList = document.getElementById('detectionList');
            detectionList.innerHTML = '';
            
            const detection = data.detection;
            
            if (detection.equipment && detection.equipment.length > 0) {
                detection.equipment.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'detection-item';
                    div.innerHTML = `<span class="label">✅ ${item.label_cn}</span> - 置信度: ${(item.conf * 100).toFixed(1)}%`;
                    detectionList.appendChild(div);
                });
            }
            
            if (detection.fire_zones && detection.fire_zones.length > 0) {
                detection.fire_zones.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'detection-item';
                    div.innerHTML = `<span class="label fire">🔥 ${item.label_cn || '动火点'}</span>`;
                    detectionList.appendChild(div);
                });
            }
            
            if (detection.equipment_count === 0 && detection.fire_zone_count === 0) {
                const div = document.createElement('div');
                div.className = 'detection-item';
                div.innerHTML = '未检测到消防器材或动火点';
                detectionList.appendChild(div);
            }
        }
    </script>
</body>
</html>
